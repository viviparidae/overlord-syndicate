<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlord Syndicate</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'MS Gothic', sans-serif;
      background: #1a1a2e;
      color: #e9e9e9;
    }
    .status-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 40px;
      background: #0f3460;
      display: flex;
      justify-content: space-around;
      align-items: center;
      font-size: 14px;
      font-weight: bold;
    }
    .status-bar .resource {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .status-bar .label {
      font-size: 10px;
      color: #aaa;
    }
    .status-bar .value {
      color: #e94560;
    }
    .command-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 80px;
      background: #0f3460;
      display: flex;
      justify-content: space-around;
      align-items: center;
      font-size: 14px;
    }
    .command-panel button {
      background: transparent;
      border: 2px solid #e94560;
      color: #e9e9e9;
      padding: 8px 16px;
      font-family: 'MS Gothic', sans-serif;
      cursor: pointer;
      border-radius: 4px;
    }
    .command-panel button:hover {
      background: #e94560;
      color: #1a1a2e;
    }
    .log-console {
      position: absolute;
      top: 40px;
      bottom: 80px;
      left: 0;
      right: 300px;
      padding: 8px;
      overflow-y: auto;
      font-family: 'MS Gothic', monospace;
      font-size: 12px;
      background: #15202b;
      color: #e9e9e9;
    }
    #game-container {
      width: 960px;
      height: 540px;
      position: relative;
    }
    .ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div class="ui-overlay">
      <div class="status-bar">
        <div class="resource">
          <span class="label">資金</span>
          <span class="value" id="funds">¥10,000</span>
        </div>
        <div class="resource">
          <span class="label">恐怖</span>
          <span class="value" id="fear">0</span>
        </div>
        <div class="resource">
          <span class="label">狂信度</span>
          <span class="value" id="faith">0</span>
        </div>
        <div class="resource">
          <span class="label">警戒度</span>
          <span class="value" id="suspect">0%</span>
        </div>
      </div>
      <div class="command-panel">
        <button type="button" id="shopBtn">店番</button>
        <button type="button" id="rumorBtn">噂を流す</button>
        <button type="button" id="intimidateBtn">脅迫</button>
      </div>
      <div class="log-console" id="logConsole"></div>
    </div>
  </div>
</body>
</html>
