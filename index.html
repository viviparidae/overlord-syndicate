<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Overlord Syndicate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: "Noto Sans JP", sans-serif;
      background: #1a1a2e;
      color: #e9e9e9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .status-bar {
      display: flex;
      gap: 16px;
      padding: 8px 16px;
      background: linear-gradient(90deg, #0f0f1a, #1a1a2e);
      border-bottom: 2px solid #e94560;
      font-family: "DotGothic16", monospace;
      font-size: 14px;
      flex-wrap: wrap;
    }
    .status-bar .resource {
      display: inline-flex;
      align-items: center;
      padding: 4px 8px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      border: 1px solid #333;
    }
    .status-bar .resource.funds { color: #4ade80; border-color: #4ade8044; }
    .status-bar .resource.fear { color: #f87171; border-color: #f8717144; }
    .status-bar .resource.faith { color: #fbbf24; border-color: #fbbf2444; }
    .status-bar .resource.suspect { color: #f472b6; border-color: #f472b644; }
    .game-container-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      overflow: hidden;
    }
    #game-container {
      border: 2px solid #e94560;
      border-radius: 4px;
      box-shadow: 0 0 20px rgba(233, 69, 96, 0.3);
      background: #000;
    }
    .command-panel {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      background: #0f0f1a;
      border-top: 1px solid #333;
      flex-wrap: wrap;
    }
    .command-panel button {
      font-family: "DotGothic16", monospace;
      font-size: 12px;
      padding: 8px 16px;
      background: #1a1a2e;
      border: 1px solid #e94560;
      color: #e9e9e9;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .command-panel button:hover {
      background: #e94560;
      color: #fff;
    }
    .command-panel button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .log-console {
      flex: 1;
      min-height: 120px;
      max-height: 180px;
      padding: 12px 16px;
      background: #0f0f1a;
      border-top: 1px solid #333;
      overflow-y: auto;
      font-family: "DotGothic16", monospace;
      font-size: 11px;
      line-height: 1.5;
    }
    .log-console .log-entry {
      padding: 2px 0;
      border-bottom: 1px solid #222;
      animation: fadeIn 0.2s;
    }
    .log-console .log-entry.system { color: #4ade80; }
    .log-console .log-entry.warning { color: #fbbf24; }
    .log-console .log-entry.error { color: #f87171; }
    .log-console .log-entry.success { color: #22d3ee; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 768px) {
      .status-bar { font-size: 11px; gap: 8px; }
      .command-panel button { font-size: 10px; padding: 6px 10px; }
    }
  </style>
</head>
<body>
  <header class="status-bar">
    <span class="resource funds" id="funds">資金: ¥10,000</span>
    <span class="resource fear" id="fear">恐怖: 0</span>
    <span class="resource faith" id="faith">狂信: 0%</span>
    <span class="resource suspect" id="suspect">警戒度: 0%</span>
  </header>

  <main class="game-container-wrapper">
    <div id="game-container"></div>
  </main>

  <div class="command-panel">
    <button id="shopBtn" type="button">店番をする</button>
    <button id="rumorBtn" type="button">噂を流す</button>
    <button id="intimidateBtn" type="button">脅迫する</button>
  </div>

  <div class="log-console" id="logConsole" role="log" aria-live="polite">
    <div class="log-entry system">> 1990年・裏社会侵食シミュレーションを開始します。</div>
    <div class="log-entry system">> コマンドを選択してください。</div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
