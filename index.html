<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Overlord Syndicate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Noto Sans JP", sans-serif;
      background: #1a1a2e;
      color: #e9e9e9;
      min-height: 100vh;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .game-container-wrapper {
      flex: 1;
      min-height: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0;
      overflow: hidden;
      position: relative;
    }
    #game-container {
      border: 2px solid #e94560;
      border-radius: 4px;
      box-shadow: 0 0 20px rgba(233, 69, 96, 0.3);
      background: #000;
      width: min(100%, 960px);
      aspect-ratio: 16 / 9;
      display: block;
    }
    /* External controller (dpad + E/T buttons) — Canvas 外 */
    .external-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 16px;
    }
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 4px;
      width: 160px;
    }
    .dpad button {
      width: 48px;
      height: 48px;
      visibility: visible;
      font-size: 14px;
      font-family: "DotGothic16", monospace;
      background: #1a1a2e;
      color: #e9e9e9;
      border: 2px solid #e94560;
      border-radius: 4px;
      cursor: pointer;
    }
    .dpad button:active { background: #e94560; color: #1a1a2e; }
    .action-keys {
      display: flex;
      gap: 12px;
    }
    .action-keys button {
      width: 64px;
      height: 64px;
      font-size: 16px;
      font-family: "DotGothic16", monospace;
      background: #1a1a2e;
      color: #e9e9e9;
      border: 2px solid #22d3ee;
      border-radius: 6px;
      cursor: pointer;
    }
    .action-keys button:active { background: #22d3ee; color: #1a1a2e; }
    @media (max-width: 768px) {
      .game-container-wrapper { padding: 8px; }
      #game-container { border-width: 1px; }
    }
    @media (max-width: 480px) {
      .game-container-wrapper { padding: 8px; }
      #game-container { border-width: 1px; }
    }
  </style>
</head>
<body>
  <main class="game-container-wrapper">
    <div id="game-container" style="aspect-ratio: 16 / 9;"></div>
  </main>

  <!-- External controller: dpad (WASD) + E/T keys — Canvas 外 -->
  <div class="external-controls">
    <div class="dpad">
      <button type="button" id="btn-up">↑</button>
      <div></div>
      <button type="button" id="btn-up-empty" disabled></button>
      <button type="button" id="btn-left">←</button>
      <button type="button" id="btn-center" disabled></button>
      <button type="button" id="btn-right">→</button>
      <button type="button" id="btn-down-empty" disabled></button>
      <div></div>
      <button type="button" id="btn-down">↓</button>
    </div>
    <div class="action-keys">
      <button type="button" id="btn-e">E</button>
      <button type="button" id="btn-t">T</button>
    </div>
  </div>

  <!-- Canvas command panel buttons — for E2E test automation -->
  <div class="command-buttons">
    <button type="button" id="btn-shop">店番</button>
    <button type="button" id="btn-rumor">噂</button>
    <button type="button" id="btn-intimidate">脅迫</button>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
